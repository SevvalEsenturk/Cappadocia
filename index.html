<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaveGuard | Kapadokya Doğal Depo & Karbon Yönetimi</title>
    <meta name="description"
        content="Kapadokya doğal depoları için otonom lojistik, karbon ayak izi takibi ve global sevkiyat yönetim sistemi.">
    <link rel="stylesheet" href="style.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Leaflet Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i data-lucide="mountain"></i>
                <span>CaveGuard</span>
            </div>
            <nav>
                <ul>
                    <li class="active" onclick="showView('dashboard')">
                        <i data-lucide="layout-dashboard"></i>
                        Dashboard
                    </li>
                    <li onclick="showView('shipments')">
                        <i data-lucide="truck"></i>
                        Sevkiyat Yönetimi
                    </li>
                    <li onclick="showView('robots')">
                        <i data-lucide="bot"></i>
                        Robot İzleme
                    </li>
                    <li onclick="showView('analytics')">
                        <i data-lucide="bar-chart-3"></i>
                        Analizler
                    </li>
                </ul>
            </nav>

            <div
                style="margin-top: auto; padding: 1rem; background: var(--surface-color); border-radius: 12px; font-size: 0.8rem;">
                <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem;">
                    <span class="status-indicator"></span>
                    <span>Sistem Çevrimiçi</span>
                </div>
                <div style="color: var(--text-secondary)">
                    Kapadokya / Bölge-1
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="content">
            <header>
                <h1 id="view-title">Dashboard</h1>
                <div class="user-profile" style="display: flex; align-items: center; gap: 1rem;">
                    <div style="text-align: right">
                        <div style="font-weight: 600">Admin Panel</div>
                        <div style="font-size: 0.75rem; color: var(--text-secondary)">Süper Yönetici</div>
                    </div>
                    <div
                        style="width: 40px; height: 40px; background: var(--primary-color); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                        <i data-lucide="user"></i>
                    </div>
                </div>
            </header>

            <div id="view-container" class="fade-in">
                <!-- Dynamic Content Loaded Here --->
            </div>
        </main>
    </div>

    <!-- Modals / Overlays -->
    <div id="order-modal" class="modal" style="display: none;">
        <!-- Modal content -->
    </div>

    <script src="app.js"></script>
</body>

</html>
